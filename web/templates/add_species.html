<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Custom Species - Cactus Weather Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-section { background: var(--surface); border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
        .form-section h2 { margin-bottom: 16px; color: var(--hunter-green); font-size: 1.25rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 600; color: var(--evergreen); font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg); }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--fern); }
        .temp-range { display: flex; gap: 8px; align-items: center; }
        .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .btn-secondary { background: var(--bg); color: var(--hunter-green); border: 2px solid var(--border); padding: 12px 24px; border-radius: 10px; text-decoration: none; }
        .help-text { background: var(--lime-cream); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="form-container">
        <header class="app-header" style="margin-bottom: 24px;">
            <h1>🌵 Add Custom Species</h1>
            <a href="/" style="color: var(--fern); text-decoration: none;">← Back to Forecast</a>
        </header>
        <div class="help-text">💡 <strong>Tip:</strong> All temperatures should be entered in Celsius. The app will automatically convert to Fahrenheit for US locations.</div>
        
        <form id="species-form">
            <div class="form-section">
                <h2>Basic Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Database Key (lowercase, no spaces)</label>
                        <input type="text" id="key" name="key" placeholder="e.g., bridgesii" required>
                    </div>
                    <div class="form-group">
                        <label>Common Name</label>
                        <input type="text" id="common_name" name="common_name" placeholder="e.g., San Pedro" required>
                    </div>
                    <div class="form-group">
                        <label>Latin Name (optional)</label>
                        <input type="text" id="latin_name" name="latin_name" placeholder="e.g., Trichocereus pachanoi">
                    </div>
                    <div class="form-group">
                        <label>Origin / Habitat</label>
                        <input type="text" id="origin" name="origin" placeholder="e.g., Andes Mountains, 6000-9000ft">
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h2>🌡️ Temperature Parameters (°C)</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Optimal Day Temperature Range</label>
                        <div class="temp-range">
                            <input type="number" id="temp_optimal_day_min" name="temp_optimal_day_min" placeholder="Min" step="0.1" required>
                            <span>to</span>
                            <input type="number" id="temp_optimal_day_max" name="temp_optimal_day_max" placeholder="Max" step="0.1" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Frost Threshold (°C)</label>
                        <input type="number" id="frost_threshold" name="frost_threshold" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Heat Stress Threshold (°C)</label>
                        <input type="number" id="heat_stress" name="heat_stress" step="0.1" required>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h2>💧 Humidity Range (%)</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Humidity Range</label>
                        <div class="temp-range">
                            <input type="number" id="humidity_min" name="humidity_min" placeholder="Min %" min="0" max="100" required>
                            <span>to</span>
                            <input type="number" id="humidity_max" name="humidity_max" placeholder="Max %" min="0" max="100" required>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h2>☀️ Additional Tolerances</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>UV Sensitivity</label>
                        <select id="uv_sensitive" name="uv_sensitive">
                            <option value="false">Tolerant (full sun OK)</option>
                            <option value="true">Sensitive (needs shade)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Wind Tolerance</label>
                        <select id="wind_tolerance" name="wind_tolerance">
                            <option value="high">High (dwarf/ground-hugging)</option>
                            <option value="moderate" selected>Moderate (average)</option>
                            <option value="low">Low (tall/thin, prone to tipping)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h2>📝 Notes</h2>
                <div class="form-group">
                    <textarea id="notes" name="notes" rows="4" placeholder="Any special care instructions..."></textarea>
                </div>
            </div>
            
            <div class="form-actions">
                <a href="/" class="btn-secondary">Cancel</a>
                <button type="submit">Save Species</button>
            </div>
        </form>
        <div id="message" style="margin-top: 20px; padding: 16px; border-radius: 8px; display: none;"></div>
    </div>
    
    <script>
        document.getElementById('species-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.style.background = '#fee2e2';
            msgDiv.style.color = '#991b1b';
            msgDiv.textContent = '✗ Custom species API not yet implemented. Coming in v2.1!';
            msgDiv.style.display = 'block';
        });
    </script>
</body>
</html>
