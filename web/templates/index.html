<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Trichocereus Weather Advisor</title>
    <!-- Timestamp-based cache buster - forces reload every time -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?ts={{ range(1, 1000000000) | random }}">
    <script src="{{ url_for('static', filename='js/app.js') }}?ts={{ range(1, 1000000000) | random }}"></script>
</body>
</html>
