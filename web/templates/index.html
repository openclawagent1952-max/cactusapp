<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Trichocereus Weather Advisor</title>
    <!-- Timestamp-based cache buster - forces reload every time -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?ts={{ range(1, 1000000000) | random }}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🌵 Trichocereus Weather Advisor</h1>
            <span class="version">version 2.0</span>
        </header>

        <section class="location-section">
            <label for="location-input" class="location-label">City or Zip Code</label>
            <input type="text" id="location-input" placeholder="Denver, CO" value="Denver, Colorado">
            <button id="search-btn">Get Forecast</button>
        </section>

        <section class="species-section">
            <h2>Select Species</h2>
            <div class="species-grid" id="species-grid"></div>
        </section>

        <section class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Consulting the weather spirits...</p>
        </section>

        <section class="results" id="results" style="display: none;">
            <div class="current-conditions" id="current"></div>
            <div id="forecast-status" style="padding: 10px; color: #666; font-size: 0.85rem;">
                <span id="cache-info"></span>
            </div>
            <div class="forecast-grid" id="forecast"></div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}?ts={{ range(1, 1000000000) | random }}"></script>
</body>
</html>
